# Edge Cloud Platform - Docker Compose
# Development and testing environment for the edge cloud platform

x-dev-image: &dev-image
  build:
    context: .
    dockerfile: Dockerfile
  user: "10001:10001"

x-runtime-hardening: &runtime-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

services:
  # Development environment
  dev:
    <<: [*dev-image, *runtime-hardening]
    container_name: edge-cloud-dev
    hostname: edge-dev
    volumes:
      - .:/workspace/project
    working_dir: /workspace/project
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - EDITOR=vim
    stdin_open: true
    tty: true
    networks:
      - edge-network
    profiles:
      - dev

  # Ansible test environment
  ansible:
    <<: [*dev-image, *runtime-hardening]
    container_name: edge-cloud-ansible
    hostname: edge-ansible
    volumes:
      - ./ansible:/workspace/project/ansible:ro
    working_dir: /workspace/project/ansible
    command: sleep infinity
    networks:
      - edge-network
    profiles:
      - ansible

  # Documentation server (optional)
  docs:
    <<: *runtime-hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: edge-cloud-docs
    hostname: edge-docs
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge-network
    profiles:
      - docs

  # Testing environment
  test:
    <<: [*dev-image, *runtime-hardening]
    container_name: edge-cloud-test
    hostname: edge-test
    environment:
      - TESTING=true
    command: /bin/bash -c "echo 'Test environment ready' && sleep infinity"
    networks:
      - edge-network
    profiles:
      - test

networks:
  edge-network:
    name: edge-cloud-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
